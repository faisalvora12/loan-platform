services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      # Inside the Compose network, services reach each other by service name, not localhost
      POSTGRES_URL: jdbc:postgresql://postgres:5432/loans
      POSTGRES_USER: loans
      POSTGRES_PASSWORD: loans
      MONGO_URI: mongodb://mongo:27017/loan_audit
    depends_on:
      postgres:
        condition: service_healthy   # wait until Postgres accepts connections, not just "container started"
      mongo:
        condition: service_healthy

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: loans
      POSTGRES_USER: loans
      POSTGRES_PASSWORD: loans
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loans -d loans"]
      interval: 5s
      retries: 10

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
  mongodata:
